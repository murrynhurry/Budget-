<body>
<title>Recipe Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a shelf of ruled index cards; open a card to cook from it. Single column app, header + grid, detail swaps in place. */
:root {
  --bg: #eef1f4;
  --card: #fdfdfb;
  --ink: #1f2630;
  --muted: #5b6571;
  --rule: #cfdcea;
  --red: #c9423a;
  --red-soft: #f6e1de;
  --line: #d8dee5;
  --chip: #e3e9ef;
  --focus: #2f6fb3;
  --food-op: .32;
  --bad: #b3261e; --bad-soft: #fbe3e0; --warn: #9a5b00; --warn-soft: #fcefd6; --ok: #2e7d4f; --ok-soft: #e0f1e6;
  --shadow: 0 1px 2px rgba(31,38,48,.08), 0 4px 14px rgba(31,38,48,.06);
  --f-display: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --h-weight: 700;
  --h-track: -0.015em;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14191f; --card: #1d242c; --ink: #e7ebef; --muted: #9ba6b2; --rule: #2a3a4c;
    --red: #ef7b70; --red-soft: #3a2426; --line: #2c353f; --chip: #27313b; --focus: #7fb2ea; --food-op: .14; --bad: #ff8a80; --bad-soft: #3d1f1d; --warn: #f5b857; --warn-soft: #3a2d14; --ok: #7fd49e; --ok-soft: #173024;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14191f; --card: #1d242c; --ink: #e7ebef; --muted: #9ba6b2; --rule: #2a3a4c;
  --red: #ef7b70; --red-soft: #3a2426; --line: #2c353f; --chip: #27313b; --focus: #7fb2ea; --food-op: .14; --bad: #ff8a80; --bad-soft: #3d1f1d; --warn: #f5b857; --warn-soft: #3a2d14; --ok: #7fd49e; --ok-soft: #173024;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
/* Gingham: two see-through stripes crossing, so the squares where they meet come out darker. */
body.bg-gingham {
  --ging: color-mix(in srgb, var(--focus) 17%, transparent);
  background-image: linear-gradient(90deg, var(--ging) 50%, transparent 50%), linear-gradient(var(--ging) 50%, transparent 50%);
  background-size: 34px 34px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body.bg-gingham { --ging: color-mix(in srgb, var(--focus) 11%, transparent); } }
:root[data-theme="dark"] body.bg-gingham { --ging: color-mix(in srgb, var(--focus) 11%, transparent); }
.top { position: relative; background: color-mix(in srgb, var(--card) 94%, transparent); border: 1px solid var(--line); border-radius: 20px; padding: 30px 18px; box-shadow: var(--shadow); }
.top::before, .top::after { content: ""; position: absolute; left: 16px; right: 16px; height: 13px; background-image: var(--heart-row); background-repeat: space; background-size: auto 100%; background-position: center; pointer-events: none; }
.top::before { top: 10px; } .top::after { bottom: 10px; }
.foodbg { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: var(--food-op); }
.wrap { position: relative; z-index: 1; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 60px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: var(--h-weight); letter-spacing: var(--h-track); text-wrap: balance; margin: 0; line-height: 1.15; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
a { color: var(--focus); }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--card); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
.btn.primary:hover { filter: brightness(1.06); }
:root[data-theme="dark"] .btn.primary { color: #1a1414; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #1a1414; } }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); }
.btn.danger { color: var(--red); }
.btn.danger.armed { background: var(--red); color: #fff; border-color: var(--red); }
.btn:disabled { opacity: .5; cursor: default; }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; margin-bottom: 18px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brandtext { min-width: 0; }
.brand h1 { font-size: 34px; }
.mascot { flex: none; width: 96px; }
.mascot .loaf { width: 100%; height: auto; display: block; animation: loafBob 3.4s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes loafBob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-4px) rotate(2deg); } }
.stitch svg { display: block; height: 44px; width: auto; max-width: 100%; color: var(--red); }
.stitch svg .x { stroke: currentColor; stroke-width: 4.2; stroke-linecap: round; fill: none; }
.stitch svg .halo { stroke: var(--bg); stroke-width: 9; stroke-linecap: round; fill: none; }
.stitch svg .sh { stroke: #fff; stroke-width: 1; stroke-linecap: round; fill: none; opacity: .28; }
#rbTitle.stitched .plain { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#rbTitle:not(.stitched) .stitch { display: none; }
#rbTitle.stitched { margin-bottom: 4px; }
@media (max-width: 760px) { .mascot { width: 72px; } .stitch svg { height: 34px; } }
/* iPhones zoom in when a text box under 16px is tapped; keep every box at 16px on phones so the page stays put. */
@media (max-width: 760px) { input, select, textarea { font-size: 16px !important; } }
@media (prefers-reduced-motion: reduce) { .mascot .loaf { animation: none; } }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
.search { flex: 1 1 260px; min-width: 0; position: relative; }
.search input { width: 100%; padding: 10px 12px 10px 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); }
select { padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }

.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
.chip { border: 1px solid transparent; background: var(--chip); color: var(--ink); padding: 4px 11px; border-radius: 999px; font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.tag { background: var(--chip); padding: 1px 8px; border-radius: 999px; font-size: 12px; color: var(--muted); }
.tag.ex { background: var(--red-soft); color: var(--red); font-weight: 600; }

.notice { background: var(--card); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 14px; font-size: 14px; color: var(--muted); margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; }

/* Index cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
.icard { position: relative; text-align: left; border: 0; cursor: pointer; background: var(--card); border-radius: 4px; box-shadow: var(--shadow); padding: 14px 16px 12px; min-height: 170px; display: flex; flex-direction: column; gap: 8px;
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 23px, var(--rule) 23px, var(--rule) 24px);
  transition: transform .15s ease, box-shadow .15s ease; }
.icard:hover { transform: translateY(-2px) rotate(-.3deg); }
.icard h3 { font-size: 23px; line-height: 1.2; overflow-wrap: anywhere; background: var(--card); margin: -14px -16px 0; padding: 14px 40px 10px 16px; border-bottom: 2px solid var(--red); border-radius: 4px 4px 0 0; }
.icard .meta { margin-top: 8px; font-family: var(--f-mono); font-size: 12px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; line-height: 24px; }
.icard .lead { font-size: 13px; color: var(--muted); line-height: 24px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.icard .foot { margin-top: auto; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.icard .star { position: absolute; top: 16px; right: 14px; color: var(--red); font-size: 18px; }
.empty { text-align: center; padding: 50px 16px; color: var(--muted); }
.empty h2 { color: var(--ink); font-size: 24px; margin-bottom: 6px; }

/* Detail */
.sheet { background: var(--card); border-radius: 6px; box-shadow: var(--shadow); padding: 22px clamp(16px, 4vw, 36px) 30px; }
.back { margin-bottom: 14px; }
.dhead { border-bottom: 2px solid var(--red); padding-bottom: 14px; margin-bottom: 18px; display: flex; flex-direction: column; gap: 10px; }
.dhead h2 { font-size: clamp(26px, 4vw, 36px); }
.dmeta { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); align-items: center; }
.dmeta b { font-family: var(--f-mono); font-weight: 500; color: var(--ink); }
.dbar { display: flex; flex-wrap: wrap; gap: 8px; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); gap: 32px; }
@media (max-width: 760px) { .cols { grid-template-columns: minmax(0, 1fr); gap: 24px; } }
.sect h3 { font-size: 20px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.scaler { display: inline-flex; align-items: center; gap: 4px; font-family: var(--f-body); font-size: 13px; color: var(--muted); }
.scaler button { width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-weight: 700; }
.scaler output { font-family: var(--f-mono); color: var(--ink); min-width: 2.2em; text-align: center; font-size: 14px; }
.ings { list-style: none; margin: 0; padding: 0; }
.ings li { border-bottom: 1px solid var(--rule); }
.ings li.sub { font-weight: 700; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 14px 0 4px; border-bottom: 0; }
.ings label { display: flex; gap: 10px; padding: 7px 0; cursor: pointer; align-items: baseline; }
.ings input { accent-color: var(--red); transform: translateY(2px); flex: none; }
.ings input:checked + span { text-decoration: line-through; color: var(--muted); }
.qty { font-family: var(--f-mono); font-weight: 500; font-size: 14px; }
.qty.scaled { color: var(--red); }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: flex; flex-direction: column; gap: 14px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 8px; max-width: 68ch; cursor: pointer; }
.steps li::before { content: counter(s); font-family: var(--f-mono); font-size: 13px; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--red); color: var(--red); display: grid; place-items: center; }
.steps li.done { color: var(--muted); }
.steps li.done::before { background: var(--red); color: var(--card); content: "✓"; }
.steps li.sub { display: block; cursor: default; counter-increment: none; font-weight: 700; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.steps li.sub::before { content: none; }
.notes { margin-top: 24px; background: var(--bg); border-radius: 8px; padding: 12px 14px; white-space: pre-wrap; font-size: 14px; }
.hint { font-size: 12px; color: var(--muted); }

/* Forms */
.form { display: grid; gap: 14px; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.field input, .field textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.field textarea { resize: vertical; min-height: 120px; line-height: 1.55; }
.formbar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; padding-top: 6px; }
.status { font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 10px; min-height: 24px; }
.status.err { color: var(--red); }
.dots::after { content: ""; animation: dots 1.2s steps(4) infinite; }
@keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
.howto { font-size: 14px; color: var(--muted); margin: 0; max-width: 68ch; }
.howto ol { margin: 6px 0 0; padding-left: 20px; }
.photo { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 14px; }
.or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
/* Fridge */
.fridge-in { display: flex; gap: 8px; flex-wrap: wrap; }
.fridge-in input { flex: 1 1 220px; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.items { display: flex; flex-wrap: wrap; gap: 6px; min-height: 34px; align-items: center; }
.item { display: inline-flex; align-items: center; gap: 4px; background: var(--chip); border-radius: 999px; padding: 4px 6px 4px 12px; font-size: 14px; }
.item button { border: 0; background: transparent; cursor: pointer; color: var(--muted); width: 22px; height: 22px; border-radius: 50%; line-height: 1; font-size: 16px; }
.item button:hover { background: var(--line); color: var(--ink); }
.check { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; cursor: pointer; }
.check input { accent-color: var(--red); }
.fsec { display: flex; flex-direction: column; gap: 12px; padding-top: 22px; margin-top: 22px; border-top: 1px solid var(--line); }
.fsec > h3 { font-size: 22px; }
.matches { display: flex; flex-direction: column; gap: 10px; }
.match { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); text-align: left; cursor: pointer; width: 100%; }
.match:hover { border-color: var(--muted); }
.match h4 { margin: 0; font-family: var(--f-display); font-weight: var(--h-weight); font-size: 17px; }
.match p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.match p b { color: var(--red); font-weight: 600; }
.match .open { color: var(--muted); font-size: 13px; }
.meter { position: relative; width: 52px; height: 52px; }
.meter svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.meter .n { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-mono); font-size: 12px; }
@media (max-width: 480px) { .match { grid-template-columns: 48px minmax(0, 1fr); } .match .open { display: none; } .meter { width: 44px; height: 44px; } }
.tabs { display: inline-flex; gap: 4px; padding: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; align-self: flex-start; }
.tab { display: inline-flex; align-items: center; gap: 8px; border: 0; background: transparent; padding: 8px 18px; font-size: 15px; font-weight: 600; color: var(--muted); cursor: pointer; border-radius: 9px; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.tcount { font-family: var(--f-mono); font-size: 12px; background: var(--chip); color: var(--muted); border-radius: 999px; padding: 0 7px; font-weight: 500; }
.tdot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
.acct { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 16px; }
.acct p { margin: 0; max-width: 68ch; }
.import-box { font: inherit; font-size: 13px; width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--bg); color: var(--ink); resize: vertical; }
.code { font-family: var(--f-mono); letter-spacing: .08em; }
.signin { max-width: 420px; margin: 40px auto; display: flex; flex-direction: column; gap: 12px; }
.signin input { font: inherit; font-size: 16px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); width: 100%; }
.livetext .howto { margin: 0; padding-left: 20px; }
.photo-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.photo-btns .btn { flex: 1 1 150px; justify-content: center; padding: 12px; }
.cstack { display: flex; flex-direction: column; gap: 32px; }
.cform { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; align-items: end; }
.cgroups { display: flex; flex-direction: column; gap: 16px; }
.cgroup { display: flex; flex-direction: column; gap: 6px; }
.crow { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto 32px; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--rule); }
.crow input { accent-color: var(--red); width: 18px; height: 18px; }
.crow.done .sname span { text-decoration: line-through; color: var(--muted); }
.cmeta { display: inline-flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 520px) { .crow { grid-template-columns: 22px minmax(0, 1fr) 32px; } .crow .cmeta { grid-column: 2; grid-row: 2; justify-content: flex-start; } }
.csum { display: flex; flex-direction: column; gap: 4px; font-size: 14px; background: var(--bg); border-radius: 8px; padding: 10px 12px; }
.csum p { margin: 0; }
.scols { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; }
@media (max-width: 800px) { .scols { grid-template-columns: minmax(0, 1fr); } }
.sside { display: flex; flex-direction: column; gap: 28px; min-width: 0; }
.ssec { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.shead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.shead h3 { font-size: 22px; }
.plans { display: flex; flex-direction: column; gap: 6px; }
.plan { display: grid; grid-template-columns: auto minmax(0, 1fr) 32px; gap: 10px; align-items: center; background: var(--bg); border-radius: 8px; padding: 4px 4px 4px 12px; }
.linkish { border: 0; background: none; padding: 0; font-weight: 700; color: var(--ink); cursor: pointer; text-align: left; }
.linkish:hover { text-decoration: underline; }
.slist { display: flex; flex-direction: column; border-top: 1px solid var(--rule); }
.srow { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto 32px; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--rule); }
.srow input { accent-color: var(--red); width: 18px; height: 18px; }
.sname { display: flex; flex-direction: column; min-width: 0; cursor: pointer; }
.sname span { font-weight: 600; overflow-wrap: anywhere; }
.sname small { font-size: 12px; color: var(--muted); }
.srow.done .sname span { text-decoration: line-through; color: var(--muted); }
.coupon { font-size: 12px; font-weight: 600; background: var(--ok-soft); color: var(--ok); border-radius: 999px; padding: 2px 9px; white-space: nowrap; }

inejoin="round"><path d="M0 -170 C-72 -100 -48 20 0 44 C48 20 72 -100 0 -170Z" fill="#ffffff"/><path d="M0 -170 V44 M-34 -118 C-44 -56 -22 16 0 44 M34 -118 C44 -56 22 16 0 44" fill="none"/><rect x="-20" y="40" width="40" height="130" rx="18" fill="#f4a3b4"/></g><ellipse cx="222" cy="150" rx="32" ry="26" fill="#e9a55d" stroke="#4a3226" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/><g transform="translate(0 -205) scale(.78)"><path d="M-120 22 C-175 22 -185 -62 -120 -74 C-108 -140 -20 -150 0 -102 C32 -150 120 -128 120 -70 C185 -64 175 22 120 22 Z" fill="#ffffff" stroke="#4a3226" stroke-width="10" stroke-linejoin="round"/><rect x="-108" y="10" width="216" height="60" rx="16" fill="#ffffff" stroke="#4a3226" stroke-width="10" stroke-linejoin="round"/><path d="M-60 12 Q-50 -30 -40 12 M0 12 Q10 -40 20 12 M60 12 Q66 -24 72 12" fill="none" stroke="#e6e0d4" stroke-width="8" stroke-linecap="round"/></g></svg></div>

<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
  if (window.LOCAL_APP && !window.CLOUD_READY) {
    // Phone app, not signed in yet: show a sign-in screen instead of the app.
    document.getElementById("apptabs").hidden = true; document.getElementById("fab").hidden = true;
    const app = document.getElementById("app"); const count = document.getElementById("count");
    count.textContent = window.CLOUD ? "Sign in to see your recipes" : "Can't reach the internet right now";
    const el = (t, a, ...k) => { const e = document.createElement(t); for (const [x, y] of Object.entries(a || {})) e.setAttribute(x, y); e.append(...k); return e; };
    const email = el("input", { type: "email", id: "si-email", placeholder: "Email", autocomplete: "email" });
    const pw = el("input", { type: "password", id: "si-pw", placeholder: "Password", autocomplete: "current-password" });
    const msg = el("p", { class: "hint", role: "status" });
    const go = async (mode) => {
      if (!window.CLOUD) return;
      msg.textContent = mode === "in" ? "Signing in…" : "Making your account…";
      try { await (mode === "in" ? window.CLOUD.signIn(email.value.trim(), pw.value) : window.CLOUD.signUp(email.value.trim(), pw.value)); location.reload(); }
      catch (e) { msg.textContent = (e && e.message) || "Couldn't sign in. Check your email and password."; }
    };
    const inBtn = el("button", { class: "btn primary", type: "submit" }, "Sign in");
    const upBtn = el("button", { class: "btn ghost", type: "button" }, "Make a new account");
    upBtn.addEventListener("click", () => go("up"));
    const form = el("form", { class: "signin sheet" }, el("h2", {}, "Welcome to Recipe Box"),
      el("p", { class: "hint" }, "Sign in with the same email and password as your budget app. Your recipes and lists are shared with Matthew through the same shared space."),
      email, pw, el("div", { class: "dbar" }, inBtn, upBtn), msg);
    form.addEventListener("submit", (e) => { e.preventDefault(); go("in"); });
    app.replaceChildren(form);
    return;
  }
  // ---------- state ----------
  const S = {
    recipes: [], loaded: false, view: "list", openId: null,
    q: "", tag: null, favOnly: false, sort: "new",
    scale: {}, checked: new Set(), stepsDone: new Set(),
    draft: null, importState: { busy: false, msg: "", err: false }, db: null, sample: null, sampleImages: false,
    noStore: false, wake: null,
    shop: { groceries: [], household: [], other: [], checked: {} }, myCoupons: [], couponFilter: "all", couponGroup: "store", fridge: [], freezer: [], pantry: [], tab: "fridge", stats: { counts: {}, pinned: [], where: {} }, deals: null, staples: true, ideas: [], ideaState: { busy: false, msg: "", err: false }, savedIdeas: new Set(),
  };
  const app = document.getElementById("app");

  // ---------- helpers ----------
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (k === "text") el.textContent = v;
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : String(k));
    return el;
  }
  const siteOf = (u) => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return ""; } };
  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.hidden = false;
    clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), 2600);
  }
  const lines = (s) => String(s || "").split(/\r?\n/).map((x) => x.trim()).filter(Boolean);
  const isSub = (s) => /^#\s*/.test(s);
  const subText = (s) => s.replace(/^#\s*/, "");

  // ---------- quantity scaling ----------
  const UNI = { "½": .5, "⅓": 1/3, "⅔": 2/3, "¼": .25, "¾": .75, "⅛": .125, "⅜": .375, "⅝": .625, "⅞": .875, "⅕": .2 };
  const NUM = "(?:\\d+\\s+\\d+\\/\\d+|\\d+\\/\\d+|\\d+(?:\\.\\d+)?\\s*[½⅓⅔¼¾⅛⅜⅝⅞⅕]?|[½⅓⅔¼¾⅛⅜⅝⅞⅕])";
  const QTY_RE = new RegExp("^(" + NUM + ")(?:(\\s*(?:-|–|to)\\s*)(" + NUM + "))?");
  function parseNum(s) {
    s = s.trim();
    let m;
    if ((m = s.match(/^(\d+)\s+(\d+)\/(\d+)$/))) return +m[1] + m[2] / m[3];
    if ((m = s.match(/^(\d+)\/(\d+)$/))) return m[1] / m[2];
    if ((m = s.match(/^(\d+(?:\.\d+)?)\s*([½⅓⅔¼¾⅛⅜⅝⅞⅕])$/))) return +m[1] + UNI[m[2]];
    if (UNI[s] != null) return UNI[s];
    return parseFloat(s);
  }
  function fmtNum(n) {
    if (n >= 20) return String(Math.round(n));
    const whole = Math.floor(n + 1e-9), frac = n - whole;
    const opts = [[0, ""], [.125, "⅛"], [.25, "¼"], [1/3, "⅓"], [.375, "⅜"], [.5, "½"], [.625, "⅝"], [2/3, "⅔"], [.75, "¾"], [.875, "⅞"], [1, ""]];
    let best = opts[0];
    for (const o of opts) if (Math.abs(o[0] - frac) < Math.abs(best[0] - frac)) best = o;
    if (Math.abs(best[0] - frac) > .06 && n < 10) return String(Math.round(n * 100) / 100);
    const w = best[0] === 1 ? whole + 1 : whole;
    if (!best[1]) return String(w);
    return (w ? w : "") + best[1];
  }
  function splitQty(text, factor) {
    const m = text.match(QTY_RE);
    if (!m) return { qty: "", rest: text };
    const a = parseNum(m[1]); const b = m[3] ? parseNum(m[3]) : null;
    if (!isFinite(a)) return { qty: "", rest: text };
    let qty;
    if (factor === 1) qty = m[0].trim();
    else qty = fmtNum(a * factor) + (b != null && isFinite(b) ? "–" + fmtNum(b * factor) : "");
    return { qty, rest: text.slice(m[0].length) };
  }

  // ---------- data ----------
  function normalize(id, d) {
    return {
      id, title: String(d.title || "Untitled recipe"), sourceUrl: String(d.sourceUrl || ""),
      servings: Number(d.servings) || null, prepTime: String(d.prepTime || ""), cookTime: String(d.cookTime || ""),
      totalTime: String(d.totalTime || ""), tags: Array.isArray(d.tags) ? d.tags.map(String) : [],
      ingredients: Array.isArray(d.ingredients) ? d.ingredients.map(String) : [],
      steps: Array.isArray(d.steps) ? d.steps.map(String) : [], notes: String(d.notes || ""),
      favorite: !!d.favorite, planned: !!d.planned, example: !!d.example, createdAt: Number(d.createdAt) || 0,
    };
  }
  function toDoc(r) {
    const { id, ...rest } = r;
    return { ...rest, updatedAt: Date.now() };
  }
  async function saveRecipe(r) {
    if (!r.id) r.id = S.db ? S.db.collection("recipes").doc().id : "local-" + Date.now();
    if (!r.createdAt) r.createdAt = Date.now();
    if (S.db && !S.noStore) {
      await S.db.doc("recipes/" + r.id).set(toDoc(r));
    } else {
      const i = S.recipes.findIndex((x) => x.id === r.id);
      if (i >= 0) S.recipes[i] = r; else S.recipes.push(r);
    }
    return r.id;
  }
  async function deleteRecipe(id) {
    if (S.db && !S.noStore) await S.db.doc("recipes/" + id).delete();
    else S.recipes = S.recipes.filter((r) => r.id !== id);
  }
  async function toggleFav(r) {
    r.favorite = !r.favorite;
    try { if (S.db && !S.noStore) await S.db.doc("recipes/" + r.id).update({ favorite: r.favorite }); }
    catch (e) { r.favorite = !r.favorite; toast("Couldn't save that change. Try again."); }
    render();
  }

  // ---------- views ----------
  function go(view, id) {
    S.view = view; S.openId = id ?? null;
    if (view !== "detail") releaseWake();
    render(); window.scrollTo({ top: 0 });
  }

  function render() {
    const n = S.recipes.filter((r) => !r.example).length;
    const ex = S.recipes.length - n;
    document.getElementById("count").textContent = !S.loaded ? "Loading your recipes…"
      : n === 0 ? (ex ? "No recipes of your own yet. Examples shown below." : "No recipes yet.")
      : n === 1 ? "1 recipe saved" : n + " recipes saved";
    const tabOf = { detail: "list", edit: "list", import: "list" }[S.view] || S.view;
    document.querySelectorAll("#apptabs button").forEach((b) => b.setAttribute("aria-current", b.dataset.view === tabOf ? "page" : "false"));
    const fp = document.getElementById("fontPanel");
    if (fp) { const show = S.view === "settings"; if (fp.hidden === show) { fp.hidden = !show; if (show) { loadFonts([...TITLE_FONTS, ...BODY_FONTS]); renderFontPanel(); } } }
    const sc = document.getElementById("shopCount");
    if (sc) { const n = S.loaded ? toBuyCount() : 0; sc.textContent = String(n); sc.hidden = !n; }
    app.replaceChildren(
      S.view === "settings" ? "" :
      S.view === "detail" ? viewDetail()
      : S.view === "edit" ? viewEdit()
      : S.view === "import" ? viewImport()
      : S.view === "fridge" ? viewFridge()
      : S.view === "shop" ? viewShop()
      : S.view === "coupons" ? viewCoupons()
      : viewList()
    );
  }

  function viewList() {
    const tags = [...new Set(S.recipes.flatMap((r) => r.tags))].sort();
    const q = S.q.toLowerCase();
    let list = S.recipes.filter((r) => {
      if (S.favOnly && !r.favorite) return false;
      if (S.tag && !r.tags.includes(S.tag)) return false;
      if (!q) return true;
      return (r.title + " " + r.tags.join(" ") + " " + r.ingredients.join(" ") + " " + siteOf(r.sourceUrl)).toLowerCase().includes(q);
    });
    list.sort(S.sort === "az" ? (a, b) => a.title.localeCompare(b.title) : (a, b) => b.createdAt - a.createdAt);

    const frag = h("div");
    if (S.noStore) frag.append(h("div", { class: "notice" }, "Saving isn't available in this view, so anything you add will be gone when you close the page."));
    const exCount = S.recipes.filter((r) => r.example).length;
    if (S.loaded && exCount && !S.noStore) {
      frag.append(h("div", { class: "notice" },
        h("span", null, "The cards marked Example are samples to show how things work."),
        h("button", { class: "btn ghost", type: "button", onclick: removeExamples }, "Remove examples")));
    }

    const search = h("input", { id: "search", type: "search", placeholder: "Search titles, ingredients, tags…", value: S.q, "aria-label": "Search recipes",
      oninput: (e) => { S.q = e.target.value; const pos = e.target.selectionStart; render(); const s = document.getElementById("search"); s.focus(); s.setSelectionRange(pos, pos); } });
    const icon = h("span"); icon.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';
    frag.append(h("div", { class: "tools" },
      h("div", { class: "search" }, icon.firstChild, search),
      h("select", { id: "sort", "aria-label": "Sort", onchange: (e) => { S.sort = e.target.value; render(); } },
        h("option", { value: "new", selected: S.sort === "new" }, "Newest first"),
        h("option", { value: "az", selected: S.sort === "az" }, "A to Z"))));

    const chips = h("div", { class: "chips", role: "toolbar", "aria-label": "Filter" },
      h("button", { class: "chip", type: "button", "aria-pressed": String(!S.tag && !S.favOnly), onclick: () => { S.tag = null; S.favOnly = false; render(); } }, "All"),
      h("button", { class: "chip", type: "button", "aria-pressed": String(S.favOnly), onclick: () => { S.favOnly = !S.favOnly; render(); } }, "★ Favourites"),
      tags.map((t) => h("button", { class: "chip", type: "button", "aria-pressed": String(S.tag === t), onclick: () => { S.tag = S.tag === t ? null : t; render(); } }, t)));
    if (S.recipes.length) frag.append(chips);

    if (!S.loaded) { frag.append(h("div", { class: "empty" }, h("p", null, "Opening the recipe box…"))); return frag; }
    if (!S.recipes.length) {
      frag.append(h("div", { class: "empty" },
        h("h2", null, "Your recipe box is empty"),
        h("p", null, "Import a recipe from any cooking site, or write one in by hand."),
        h("button", { class: "btn primary", type: "button", onclick: () => startImport() }, "Import your first recipe")));
      return frag;
    }
    if (!list.length) { frag.append(h("div", { class: "empty" }, h("p", null, "Nothing matches that search."))); return frag; }

    frag.append(h("div", { class: "grid" }, list.map(card)));
    return frag;
  }

  function card(r) {
    const time = r.totalTime || r.cookTime || r.prepTime;
    const firstIngs = r.ingredients.filter((x) => !isSub(x)).slice(0, 4).map((x) => itemName(x)).join(" · ");
    return h("button", { class: "icard", type: "button", onclick: () => go("detail", r.id), "aria-label": "Open " + r.title },
      h("h3", null, r.title),
      r.favorite ? h("span", { class: "star", "aria-label": "Favourite" }, "★") : null,
      h("div", { class: "meta" },
        time ? h("span", null, "⏱ " + time) : null,
        r.servings ? h("span", null, "Serves " + r.servings) : null,
        h("span", null, r.ingredients.filter((x) => !isSub(x)).length + " ingredients")),
      firstIngs ? h("div", { class: "lead" }, firstIngs) : null,
      h("div", { class: "foot" },
        r.planned ? h("span", { class: "tag plan" }, "Planned") : null,
        r.example ? h("span", { class: "tag ex" }, "Example") : null,
        r.tags.slice(0, 3).map((t) => h("span", { class: "tag" }, t)),
        siteOf(r.sourceUrl) ? h("span", { class: "tag" }, siteOf(r.sourceUrl)) : null));
  }

  function viewDetail() {
    const r = S.recipes.find((x) => x.id === S.openId);
    if (!r) { S.view = "list"; return viewList(); }
    const base = r.servings || null;
    const target = S.scale[r.id] || base;
    const factor = base && target ? target / base : 1;

    const setScale = (n) => { S.scale[r.id] = Math.max(1, n); render(); };
    let delArmed = false, delTimer;
    const delBtn = h("button", { class: "btn danger", type: "button", onclick: async () => {
      if (!delArmed) { delArmed = true; delBtn.classList.add("armed"); delBtn.textContent = "Tap again to delete"; delTimer = setTimeout(() => { delArmed = false; delBtn.classList.remove("armed"); delBtn.textContent = "Delete"; }, 4000); return; }
      clearTimeout(delTimer);
      try { await deleteRecipe(r.id); toast("Deleted " + r.title); go("list"); } catch { toast("Couldn't delete it. Try again."); }
    } }, "Delete");

    const wakeBtn = h("button", { class: "btn", type: "button", "aria-pressed": String(!!S.wake), onclick: toggleWake }, S.wake ? "Screen stays on ✓" : "Keep screen on");

    const ingList = h("ul", { class: "ings" }, r.ingredients.map((line, i) => {
      if (isSub(line)) return h("li", { class: "sub" }, subText(line));
      const key = r.id + ":" + i;
      const { qty, rest } = splitQty(line, factor);
      const cb = h("input", { type: "checkbox", id: "ing-" + i, checked: S.checked.has(key), onchange: (e) => { e.target.checked ? S.checked.add(key) : S.checked.delete(key); } });

  const PROMPT = `You are extracting one recipe for a personal recipe organizer. The input is text copied from a recipe web page (it may include ads, navigation, comments and a long story) or a photo of a recipe. Find the main recipe and reply with ONLY one JSON object in this shape:
{"title": string, "servings": number or null, "prepTime": string, "cookTime": string, "totalTime": string, "tags": string[], "ingredients": string[], "steps": string[], "notes": string}
Rules:
- ingredients: one line each, quantity first as written (e.g. "1 1/2 cups all-purpose flour"). If the recipe groups ingredients, add a heading line starting with "# " (e.g. "# For the glaze").
- steps: one instruction per item, without step numbers. Use "# " heading items for grouped steps.
- times: short strings like "15 min" or "1 hr 10 min"; use "" when not given. servings: the first number of servings/yield, or null.
- tags: 2 to 4 short lowercase tags such as the meal (breakfast, dinner, dessert, baking), main ingredient, cuisine or diet.
- notes: brief useful tips from the recipe card itself (storage, substitutions); "" if none. Ignore reader comments and ads.
- If there is no recipe in the input, reply {"error": "no recipe found"}.`;

  async function runImport() {
    const urlVal = importFields.url.trim(), textVal = importFields.text.trim();
    if (window.LOCAL_APP && window.CLOUD && window.CLOUD.importUrl && urlVal && !textVal) {
      S.importState = { busy: true, err: false, msg: "Reading the recipe from that link" }; render();
      try {
        const data = await window.CLOUD.importUrl(urlVal);
        const r = { ...blank(), ...normalize(null, data), id: null, sourceUrl: urlVal, createdAt: 0, example: false, favorite: false };
        r.tags = r.tags.map((t) => t.toLowerCase()).slice(0, 5);
        S.draft = r; S.importState = { busy: false, msg: "", err: false }; return go("edit");
      } catch (e) {
        S.importState = { busy: false, err: true, msg: ((e && e.message) || "Couldn't read that link.") + " Paste the recipe page text below instead." };
        return render();
      }
    }
    if (!textVal && !importPhoto) {
      S.importState = { busy: false, err: true, msg: urlVal ? "Paste the text from the recipe page too. This page can't open the link by itself." : "Paste the recipe page text first." };
      return render();
    }
    if (!S.sample) {
      const r = roughParse(textVal); r.sourceUrl = urlVal;
      S.draft = r; toast("Sorted it as best I could. Check it over."); return go("edit");
    }
    importCtl = new AbortController();
    S.importState = { busy: true, err: false, msg: "Reading the recipe" }; render();
    try {
      const input = PROMPT + (urlVal ? "\n\nSource link: " + urlVal : "") + (textVal ? "\n\nPage text:\n" + textVal.slice(0, 60000) : "\n\nThe recipe is in the attached image.");
      const opts = { modelTier: "quick", signal: importCtl.signal, onText: () => { if (S.importState.msg !== "Writing it up") { S.importState.msg = "Writing it up"; render(); } } };
      if (importPhoto) opts.images = importPhoto;
      const data = await S.sample.json(input, opts);
      if (!data || typeof data !== "object" || data.error || !data.title) {
        S.importState = { busy: false, err: true, msg: "Couldn't find a recipe in that. Make sure you copied the whole recipe page." };
        return render();
      }
      const r = { ...blank(), ...normalize(null, data), id: null, sourceUrl: urlVal, createdAt: 0, example: false, favorite: false };
      r.tags = r.tags.map((t) => t.toLowerCase()).slice(0, 5);
      S.draft = r; S.importState = { busy: false, msg: "", err: false }; go("edit");
    } catch (e) {
      const code = e && e.code;
      if (code === "cancelled") { S.importState = { busy: false, err: false, msg: "Stopped." }; return render(); }
      if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(code)) {
        S.sample = null;
        const r = roughParse(textVal); r.sourceUrl = urlVal; S.draft = r;
        toast("Claude isn't available here, so I sorted it by headings. Check it over."); return go("edit");
      }
      const msg = code === "rate_limited" ? "Too many imports at once. Wait a minute and try again."
        : code === "prompt_too_large" ? "That's a lot of text. Copy just the recipe part and try again."
        : code === "invalid_json" ? "The recipe came back garbled. Press Read recipe to try again."
        : code === "image_rejected" ? "That image couldn't be read. Try a JPEG or PNG under 20 MB."
        : code === "session_expired" ? "You've been signed out of Claude. Sign in again, then retry."
        : "Something went wrong while reading it. Press Read recipe to try again.";
      S.importState = { busy: false, err: true, msg }; render();
    }
  }

  // Fallback: split pasted text on Ingredients / Method headings.
  // Sorts plain recipe text (pasted, or read from a photo) into a recipe.
  // Handles cookbook pages with no headings: tags and title at the top, a times line, a story paragraph,
  // ingredients that wrap onto a second line (in columns), sub-recipe headings, numbered steps that run
  // over several lines, a note, and the page footer.
  function roughParse(text) {
    const SUP = { "⁰": "0", "¹": "1", "²": "2", "³": "3", "⁴": "4", "⁵": "5", "⁶": "6", "⁷": "7", "⁸": "8", "⁹": "9", "₀": "0", "₁": "1", "₂": "2", "₃": "3", "₄": "4", "₅": "5", "₆": "6", "₇": "7", "₈": "8", "₉": "9", "⁄": "/" };
    const fix = (l) => l.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹₀₁₂₃₄₅₆₇₈₉⁄]/g, (c) => SUP[c])
      .replace(/^(\d)(1\/[2-8])\b/, "$1 $2")           // "11/2 cups" read from "1½ cups"
      .replace(/^(\d)\s*['’`]\s*\/\s*(\d)/, "$1 1/$2")    // "1'/2" from a small ½
      .replace(/\s+/g, " ").replace(/^[•·▪◦*\-–]\s*/, "").trim();
    const all = lines(text).map(fix).filter((l) => l.length > 1);
    const r = blank();
    const AMOUNT = /^(\d|[½⅓⅔¼¾⅛]|one |two |three |a |an |pinch|dash|handful)/i;
    const isIngHead = (l) => /^ingredients?\b:?$/i.test(l) || /^ingredients?\b/i.test(l) && l.length < 25;
    const isStepHead = (l) => /^(instructions|directions|method|steps|preparation|how to make)\b/i.test(l) && l.length < 30;
    const isStepNum = (l) => /^(step\s*)?\d{1,2}[.):]\s+\S/i.test(l);
    const isTimes = (l) => /\b(prep|cook|total)\s*time\b|\bserves\s*\d|\bservings?\s*:?\s*\d|\byield\b/i.test(l);
    const isFooter = (l) => /^[a-z &]{2,30}\s*[•·|]\s*\d{1,4}$/i.test(l) || /^\d{1,4}\s*[•·|]\s*[a-z &]{2,30}$/i.test(l) || /^\d{1,4}$/.test(l);
    const isNote = (l) => /^(notes?|tips?|cook'?s note)\s*:/i.test(l);
    const isTitleCaseHead = (l) => l.length < 40 && !/\d/.test(l) && !/[,.;:()]/.test(l) && l.split(" ").length <= 4 && l.split(" ").every((w) => /^[A-Z&]/.test(w) || /^(and|or|of|the|for|with)$/.test(w));
    const isAllCaps = (l) => l === l.toUpperCase() && /[A-Z]{3,}/.test(l);

    // Times and servings
    const tx = all.filter(isTimes).join(" · ");
    const t = (re) => { const m = tx.match(re); return m ? m[1].replace(/minutes?/i, "min").replace(/hours?/i, "hr").trim() : ""; };
    r.prepTime = t(/prep\s*time\s*:?\s*([\d\s]+(?:hours?|hrs?|minutes?|mins?)(?:\s*\d+\s*(?:minutes?|mins?))?)/i);
    r.cookTime = t(/cook\s*time\s*:?\s*([\d\s]+(?:hours?|hrs?|minutes?|mins?)(?:\s*\d+\s*(?:minutes?|mins?))?)/i);
    r.totalTime = t(/total\s*time\s*:?\s*([\d\s]+(?:hours?|hrs?|minutes?|mins?)(?:\s*\d+\s*(?:minutes?|mins?))?)/i);
    const sv = (tx || text).match(/(?:serves|servings|yield|makes)\s*:?\s*(\d+)/i); if (sv) r.servings = +sv[1];

    let ls = all.filter((l) => !isTimes(l) && !isFooter(l));
    // Notes: from a "note:" line to the end (or to the next numbered step)
    const ni = ls.findIndex(isNote);
    if (ni >= 0) {
      let end = ls.length; for (let k = ni + 1; k < ls.length; k++) if (isStepNum(ls[k])) { end = k; break; }
      r.notes = ls.slice(ni, end).join(" ").replace(/^(notes?|tips?|cook'?s note)\s*:\s*/i, "");
      ls = ls.slice(0, ni).concat(ls.slice(end));
    }

    // Join wrapped lines: a line that starts lowercase (or with ")" / "&") continues the one above.
    const joinWraps = (arr) => {
      const out = [];
      for (const l of arr) {
        if (out.length && /^[a-z(&)]/.test(l) && !AMOUNT.test(l.replace(/^[a-z]+\s/, "x")) ) out[out.length - 1] += " " + l;
        else out.push(l);
      }
      return out;
    };
    const joinSteps = (arr) => {
      const numbered = arr.some(isStepNum);
      const out = [];
      for (const l of arr) {
        const clean = l.replace(/^(step\s*)?\d{1,2}[.):]?\s*/i, "");
        const newStep = numbered ? isStepNum(l) || !out.length : (!out.length || /[.!?:)]$/.test(out[out.length - 1]));
        if (newStep) out.push(clean); else out[out.length - 1] += " " + l;
      }
      return out.map((x) => x.trim()).filter((x) => x.length > 8).slice(0, 40);
    };
    const toIngredients = (arr) => joinWraps(arr).map((l) => isTitleCaseHead(l) && !AMOUNT.test(l) && l.split(" ").length <= 3 && /^[A-Z]/.test(l) && !/salt|pepper|oil|flakes/i.test(l) ? "# " + l : l)
      .filter((l) => l.length < 140).slice(0, 70);

    const iI = ls.findIndex(isIngHead);
    const iS = ls.findIndex((l, k) => k > iI && isStepHead(l));
    const firstNum = ls.findIndex(isStepNum);
    // Top of the page: all-caps tag lines, then the title (a following "with ..." line is its subtitle)
    let top = 0; const tags = [];
    // Short all-caps labels at the top ("VEGETARIAN", "30 MINUTES OR LESS") are tags, unless that's all there is before the recipe.
    while (top < ls.length - 1 && isAllCaps(ls[top]) && ls[top].length < 30 && !isIngHead(ls[top]) && ls.slice(top + 1).some((l) => !isAllCaps(l) && l.length > 3 && l.length < 80 && !AMOUNT.test(l))) { tags.push(ls[top].toLowerCase()); top++; }
    const titleAt = ls.findIndex((l, k) => k >= top && l.length > 3 && l.length < 80 && !AMOUNT.test(l) && !isIngHead(l) && !isStepHead(l));
    if (titleAt >= 0) {
      let title = ls[titleAt];
      if (ls[titleAt + 1] && /^(with|and|plus|&)\b/i.test(ls[titleAt + 1]) && ls[titleAt + 1].length < 60) title += " " + ls[titleAt + 1];

  function buildStitchTitle() {
    const G = {

      C: ["01110","10001","10000","10000","10000","10001","01110"], I: ["111","010","010","010","010","010","111"],

      " ": ["00","00","00","00","00","00","00"],
    };
    const s = 10, pad = 2.2; let x = 0, d = "", hl = "";
    let seed = 11; const r = () => { seed = (seed * 16807) % 2147483647; return (seed / 2147483647 - 0.5) * 0.9; };
    for (const ch of "RECIPE BOX") {
      const g = G[ch];
      g.forEach((row, ry) => [...row].forEach((c, rx) => {
        if (c !== "1") return;
        const X = x + rx * s, Y = ry * s;
        d += `M${(X + pad + r()).toFixed(1)} ${(Y + pad + r()).toFixed(1)}L${(X + s - pad + r()).toFixed(1)} ${(Y + s - pad + r()).toFixed(1)}M${(X + s - pad + r()).toFixed(1)} ${(Y + pad + r()).toFixed(1)}L${(X + pad + r()).toFixed(1)} ${(Y + s - pad + r()).toFixed(1)}`;

      }));
      x += (g[0].length + 1) * s;
    }
    const w = x - s;
    document.getElementById("stitchTitle").innerHTML =
      `<svg viewBox="-5 -5 ${w + 10} ${7 * s + 10}" focusable="false"><path class="halo" d="${d}"/><path class="x" d="${d}"/><path class="sh" d="${hl}"/></svg>`;
  }

      try { const snap = await S.db.doc(path).get(); if (snap.exists) { const [coll, id] = path.split("/"); out.docs.push({ coll, id, data: snap.data() }); } } catch {}

      for (const [id, val, had] of ids) { const n = document.getElementById(id); if (n) { n.value = val; if (had) n.focus(); } }
    };
    for (const loc of LOC_KEYS) {
      db.doc(LOCS[loc].doc).onSnapshot((snap) => {
        if (!snap.exists || snap.metadata.hasPendingWrites) return;
        const d = snap.data() || {};
        const items = Array.isArray(d.items) ? d.items.map(normItem).filter((x) => x.name) : [];
        const staples = loc === "fridge" ? d.staples !== false : S.staples;
        if (JSON.stringify(items) === JSON.stringify(S[loc]) && staples === S.staples) return;
        S[loc] = items; S.staples = staples; rerenderFridge();
      }, () => {});
    }
    db.doc("fridge/stats").onSnapshot((snap) => {
      if (!snap.exists || snap.metadata.hasPendingWrites) return;
      const d = snap.data() || {};
      const next = { counts: d.counts && typeof d.counts === "object" ? { ...d.counts } : {}, pinned: Array.isArray(d.pinned) ? d.pinned.map(String) : [], where: d.where && typeof d.where === "object" ? { ...d.where } : {} };
      if (JSON.stringify(next) === JSON.stringify(S.stats)) return;
      S.stats = next; rerenderFridge();
    }, () => {});
    db.doc("coupons/mine").onSnapshot((snap) => {
      if (!snap.exists || snap.metadata.hasPendingWrites) return;
      const d = snap.data() || {};
      const list = Array.isArray(d.list) ? d.list.filter((c) => c && c.item).map((c) => ({ id: String(c.id || "c" + Math.random().toString(36).slice(2)), item: String(c.item), deal: String(c.deal || ""), store: String(c.store || ""), expires: String(c.expires || ""), used: !!c.used })) : [];
      if (JSON.stringify(list) === JSON.stringify(S.myCoupons)) return;
      S.myCoupons = list; rerenderFridge();
    }, () => {});
    db.doc("shopping/list").onSnapshot((snap) => {
      if (!snap.exists || snap.metadata.hasPendingWrites) return;
      const d = snap.data() || {};
      const clean = (a) => Array.isArray(a) ? a.filter((x) => x && x.name).map((x) => ({ name: String(x.name), done: !!x.done })) : [];
      const next = { groceries: clean(d.groceries), household: clean(d.household), other: clean(d.other), checked: d.checked && typeof d.checked === "object" ? { ...d.checked } : {} };
      if (JSON.stringify(next) === JSON.stringify(S.shop)) return;
      S.shop = next; rerenderFridge();
    }, () => {});
    db.doc("deals/latest").onSnapshot((snap) => {
      S.deals = snap.exists ? snap.data() : null; rerenderFridge();
    }, () => {});
  })();
})();
</script>
